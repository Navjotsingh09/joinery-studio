name: Verify Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://yudzfpuizzejpnkoxidx.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ocqbsvwCTPrnw335PZLjfA_HQj9KJ7M
